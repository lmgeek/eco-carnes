server {
    # Dokploy/Traefik puede enrutar al puerto 80 o al 3000 (valor por defecto
    # de muchas apps). Escuchamos ambos para evitar un 502 por diferencia de puerto.
    listen 80;
    listen 3000;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;

    include /etc/nginx/snippets/security.conf;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # La configuración se genera al arrancar el contenedor: nunca cachearla.
    location = /js/config.js {
        include /etc/nginx/snippets/security.conf;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    }

    location ~* \.(?:svg|png|webp|jpe?g|gif|ico|woff2?)$ {
        include /etc/nginx/snippets/security.conf;
        expires 7d;
        add_header Cache-Control "public, immutable" always;
        try_files $uri =404;
    }

    location / {
        include /etc/nginx/snippets/security.conf;
        try_files $uri $uri/ /index.html;
    }
}
