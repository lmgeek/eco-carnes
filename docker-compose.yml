services:
  menu:
    build:
      context: .
      dockerfile: Dockerfile
    image: eco-carnes-menu:latest
    restart: unless-stopped
    # Dokploy/Traefik ya ocupa el puerto 80 del host. No publicar puertos aquí:
    # Traefik alcanza el contenedor por la red interna de Docker.
    expose:
      - "80"
      - "3000"
    environment:
      SUPABASE_URL: ${SUPABASE_URL:-}
      SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY:-}
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME:-}
      CLOUDINARY_UPLOAD_PRESET: ${CLOUDINARY_UPLOAD_PRESET:-}
      CLOUDINARY_FOLDER: ${CLOUDINARY_FOLDER:-carnes}
